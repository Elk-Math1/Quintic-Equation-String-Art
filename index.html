<html lang="ko">
<head>
<meta charset="UTF-8">

<title>5차 방정식 스트링아트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:#f8f7f4;color:#1a1a18;font-size:13px;overflow:hidden;height:100vh;}
.app{display:flex;height:100vh;}

.lp{width:280px;flex-shrink:0;border-right:0.5px solid rgba(0,0,0,0.18);display:flex;flex-direction:column;background:#fff;}
.ph{padding:12px 13px 9px;border-bottom:0.5px solid rgba(0,0,0,0.1);}
.ph h1{font-size:12.5px;font-weight:500;margin-bottom:3px;}
.ph p{font-size:10.5px;color:#6b6b67;line-height:1.4;}
.sctrl{padding:7px 10px;border-bottom:0.5px solid rgba(0,0,0,0.1);display:flex;flex-direction:column;gap:5px;}
.sctrl input{width:100%;border:0.5px solid rgba(0,0,0,0.18);border-radius:5px;padding:4px 8px;font-size:11px;background:#f8f7f4;color:#1a1a18;outline:none;}
.sctrl input:focus{border-color:#185FA5;}
.chaps{display:flex;gap:3px;flex-wrap:wrap;}
.cb{font-size:10px;padding:2px 7px;border-radius:9px;cursor:pointer;border:0.5px solid rgba(0,0,0,0.18);background:#fff;color:#6b6b67;}
.cb.on{background:#1a1a18;color:#fff;border-color:#1a1a18;}
.drow{display:flex;align-items:center;gap:6px;font-size:11px;color:#6b6b67;}
.drow select{font-size:11px;padding:2px 5px;border:0.5px solid rgba(0,0,0,0.18);border-radius:4px;background:#fff;color:#1a1a18;outline:none;}
.tlist{overflow-y:auto;flex:1;}
.ti{padding:6px 10px;cursor:pointer;border-bottom:0.5px solid rgba(0,0,0,0.07);display:flex;align-items:flex-start;gap:6px;}
.ti:hover{background:#f8f7f4;}
.ti.sel{background:#E6F1FB;}
.tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.tinf{flex:1;min-width:0;}
.tiid{font-size:11px;font-weight:500;}
.tinm{font-size:10px;color:#6b6b67;margin-top:1px;}
.titags{display:flex;gap:2px;flex-wrap:wrap;margin-top:2px;}
.tag{font-size:9.5px;padding:1px 5px;border-radius:5px;border:0.5px solid transparent;}
.tu{background:#E6F1FB;color:#0C447C;border-color:#85B7EB;}
.tb2{background:#EEEDFE;color:#3C3489;border-color:#AFA9EC;}
.detail{padding:9px 11px 10px;border-top:0.5px solid rgba(0,0,0,0.1);font-size:11px;min-height:70px;max-height:150px;overflow-y:auto;background:#f8f7f4;}
.detail h4{font-size:11px;font-weight:500;margin-bottom:5px;}
.ddr{display:flex;gap:5px;margin-bottom:3px;align-items:flex-start;}
.ddl{color:#6b6b67;min-width:50px;font-size:10px;flex-shrink:0;padding-top:1px;}
.ddtags{display:flex;flex-wrap:wrap;gap:2px;}
.ss{padding:6px 10px;border-top:0.5px solid rgba(0,0,0,0.1);}
.ss h5{font-size:10px;font-weight:500;color:#6b6b67;margin-bottom:4px;}
.sl{display:flex;flex-wrap:wrap;gap:3px;}
.sp{font-size:9.5px;padding:1px 6px;border-radius:6px;background:#f1f0eb;color:#6b6b67;border:0.5px solid rgba(0,0,0,0.18);cursor:pointer;}
.sp:hover{background:#e0e0dc;}
.sp.sel{background:#f0eeff;color:#3C3489;border-color:#AFA9EC;}

.mp{flex:1;position:relative;overflow:hidden;background:#f8f7f4;}
.toolbar{position:absolute;top:8px;right:8px;z-index:10;display:flex;gap:4px;}
.mbtn{font-size:11px;padding:2px 9px;border-radius:5px;cursor:pointer;border:0.5px solid rgba(0,0,0,0.18);background:#fff;color:#6b6b67;}
.mbtn:hover{color:#1a1a18;}
.hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;color:#9b9b96;background:#fff;padding:2px 9px;border-radius:9px;border:0.5px solid rgba(0,0,0,0.1);white-space:nowrap;}
.dlgd{position:absolute;bottom:8px;right:8px;z-index:10;background:#fff;border:0.5px solid rgba(0,0,0,0.18);border-radius:6px;padding:6px 9px;font-size:10px;display:none;}
.dlgd .dt{font-weight:500;margin-bottom:4px;}
.dlgrow{display:flex;align-items:center;gap:5px;margin-bottom:2px;color:#6b6b67;}
.dlgsw{width:20px;height:3px;border-radius:2px;}
svg{width:100%;height:100%;cursor:grab;}
svg:active{cursor:grabbing;}
</style>
</head>

const CH_BG={'1':'#E6F1FB','2':'#EEEDFE','3':'#EAF3DE','4':'#FAEEDA','5':'#E1F5EE','6':'#FAECE7'};
const CH_BD={'1':'#85B7EB','2':'#AFA9EC','3':'#97C459','4':'#EF9F27','5':'#5DCAA5','6':'#F0997B'};
const DU=['#1a6dd4','#5b9fe8','#9fc8f5'];
const DB=['#6b21e8','#9d5ef0','#c49df8'];

let SEL=null, curCh='all', POS={};
const NW=122, NH=40;

// ── RADIAL LAYOUT ──────────────────────────────────────────────────────────
// All theorems on ONE big circle. Chapters get angular slices; within each
// slice theorems are evenly spaced. The result is a single clean ring.
function makeLayout(){
  const pos={};
  const byChap={};
  T.forEach(t=>{
    const c=t.id.split('.')[0];
    if(!byChap[c])byChap[c]=[];
    byChap[c].push(t);
  });
  const chs=Object.keys(byChap).sort();
  const totalN=T.length;
  const CX=2996, CY=2996, R=2820;
  const GAP_FRAC=0.036; // angular gap between chapters (fraction of full circle)
  const totalGap=GAP_FRAC*chs.length;
  const usableFrac=1-totalGap;

  // Each chapter gets arc proportional to its theorem count
  let startAng=-Math.PI/2; // start from top
  chs.forEach(ch=>{
    const items=byChap[ch].sort((a,b)=>+a.id.split('.')[1]-+b.id.split('.')[1]);
    const M=items.length;
    const arcSpan=(M/totalN)*usableFrac*2*Math.PI;
    items.forEach((t,i)=>{
      const frac=M>1?i/(M-1):0.5;
      const ang=startAng+frac*arcSpan;
      pos[t.id]={x:CX+R*Math.cos(ang), y:CY+R*Math.sin(ang), w:NW, h:NH, ang};
    });
    startAng+=arcSpan+GAP_FRAC*2*Math.PI;
  });
  return pos;
}

// ── SVG SETUP ──────────────────────────────────────────────────────────────
let pan={x:0,y:0,sc:1};
let dragging=false, lastMouse=null;
const sv=document.getElementById('sv');
const mr=document.getElementById('mr');

function buildMap(){
  POS=makeLayout();
  mr.innerHTML='';

  const eg=document.createElementNS('http://www.w3.org/2000/svg','g');
  eg.id='eg'; mr.appendChild(eg);
  const ng=document.createElementNS('http://www.w3.org/2000/svg','g');
  ng.id='ng'; mr.appendChild(ng);

  T.forEach(t=>{
    const p=POS[t.id]; if(!p)return;
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.id=`n-${t.id}`;
    g.setAttribute('transform',`translate(${(p.x-p.w/2).toFixed(1)},${(p.y-p.h/2).toFixed(1)})`);
    g.style.cursor='pointer';

    const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('width',p.w); r.setAttribute('height',p.h); r.setAttribute('rx',4);
    r.setAttribute('fill',CH_BG[t.id.split('.')[0]]);
    r.setAttribute('stroke',CH_BD[t.id.split('.')[0]]);
    r.setAttribute('stroke-width',t.id==='6.10'?'2':'0.8');
    if(t.s)r.setAttribute('stroke-dasharray','3,2');
    g.appendChild(r);

    const label1=document.createElementNS('http://www.w3.org/2000/svg','text');
    label1.setAttribute('x','7'); label1.setAttribute('y','15');
    label1.setAttribute('fill',CH_COL[t.id.split('.')[0]]);
    label1.setAttribute('font-size','10.5'); label1.setAttribute('font-weight','500');
    label1.setAttribute('font-family',"system-ui,-apple-system,sans-serif");
    label1.textContent=`Theorem ${t.id}${t.s?' ↗':''}${t.cl?' ○':''}`;
    g.appendChild(label1);

    if(t.n){
      const label2=document.createElementNS('http://www.w3.org/2000/svg','text');
      label2.setAttribute('x','7'); label2.setAttribute('y','28');
      label2.setAttribute('fill',CH_COL[t.id.split('.')[0]]);
      label2.setAttribute('font-size','8.5'); label2.setAttribute('opacity','0.72');
      label2.setAttribute('font-family',"system-ui,-apple-system,sans-serif");
      label2.textContent=t.n.length>16?t.n.slice(0,15)+'…':t.n;
      g.appendChild(label2);
    }

    g.addEventListener('click',e=>{e.stopPropagation();selNode(t.id);});
    ng.appendChild(g);
  });

  sv.addEventListener('click',()=>{
    if(hasDragged)return;
    if(SEL){SEL=null;lastUM={};lastBM={};drawEdges();hlNodes();rl();rd();}
  });

  drawEdges();
  rv();
}

// ── BFS ────────────────────────────────────────────────────────────────────
let lastUM={}, lastBM={};

function bfsU(sid,max){
  const v={};let f=[sid];
  for(let d=1;d<=max&&f.length;d++){
    const nx=[];
    f.forEach(id=>{
      (T.find(x=>x.id===id)||{d:[]}).d.forEach(dep=>{
        if(v[dep]===undefined){v[dep]=d;nx.push(dep);}
      });
    });
    f=nx;
  }
  return v;
}

function bfsB(sid,max){
  const v={};let f=[sid];
  for(let d=1;d<=max&&f.length;d++){
    const nx=[];
    f.forEach(id=>{
      (UB[id]||[]).forEach(uid=>{
        if(v[uid]===undefined){v[uid]=d;nx.push(uid);}
      });
    });
    f=nx;
  }
  return v;
}

function getMaxU(){const v=parseInt(document.getElementById('depU').value);return isNaN(v)?999:v;}
function getMaxB(){const v=parseInt(document.getElementById('depB').value);return isNaN(v)?999:v;}

function highlight(){
  if(!SEL){lastUM={};lastBM={};drawEdges();hlNodes();return;}
  lastUM=bfsU(SEL,getMaxU());
  lastBM=bfsB(SEL,getMaxB());
  drawEdges();hlNodes();
}

// ── DRAW EDGES ─────────────────────────────────────────────────────────────
function drawEdges(){
  const eg=document.getElementById('eg'); if(!eg)return;
  eg.innerHTML='';

  T.forEach(t=>{
    const tp=POS[t.id]; if(!tp)return;
    t.d.forEach((di,ei)=>{
      const fp=POS[di]; if(!fp)return;

      let stroke='#c8c8c4', sw=0.8, op=SEL?0.05:0.38, marker='url(#a0)';

      if(SEL){
        const tU=lastUM[t.id], dU=lastUM[di];
        const tB=lastBM[t.id], dB=lastBM[di];
        const onU=(t.id===SEL||tU!==undefined)&&(di===SEL||dU!==undefined);
        const onB=(t.id===SEL||tB!==undefined)&&(di===SEL||dB!==undefined);

        if(onU){
          const d=tU||1;
          const ci=Math.min(d-1,2);
          stroke=DU[ci];sw=2;op=1;marker=`url(#au${Math.min(d,3)})`;
        } else if(onB){
          const d=dB||1;
          const ci=Math.min(d-1,2);
          stroke=DB[ci];sw=1.6;op=1;marker=`url(#ab${Math.min(d,3)})`;
        } else {
          stroke='#ddd';sw=0.5;op=0.08;
        }
      }

      const dx=tp.x-fp.x, dy=tp.y-fp.y;
      const dist=Math.sqrt(dx*dx+dy*dy)||1;
      const nx=dx/dist, ny=dy/dist;
      const ex1=fp.x+nx*(fp.w/2+2), ey1=fp.y+ny*(fp.h/2+2);
      const ex2=tp.x-nx*(tp.w/2+6), ey2=tp.y-ny*(tp.h/2+6);
      // Curve offset alternates direction per edge index
      const off=(ei%3-1)*12;
      const cx=(ex1+ex2)/2+ny*off, cy=(ey1+ey2)/2-nx*off;

      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('fill','none');
      path.setAttribute('d',`M${ex1.toFixed(1)},${ey1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${ex2.toFixed(1)},${ey2.toFixed(1)}`);
      path.setAttribute('stroke',stroke);
      path.setAttribute('stroke-width',sw);
      path.setAttribute('stroke-opacity',op);
      path.setAttribute('marker-end',marker);
      eg.appendChild(path);
    });
  });
}

// ── HIGHLIGHT NODES ─────────────────────────────────────────────────────────
function hlNodes(){
  T.forEach(t=>{
    const g=document.getElementById(`n-${t.id}`); if(!g)return;
    const r=g.querySelector('rect');
    const ch=t.id.split('.')[0];
    // Reset
    r.setAttribute('fill',CH_BG[ch]);
    r.setAttribute('stroke',CH_BD[ch]);
    r.setAttribute('stroke-width',t.id==='6.10'?'2':'0.8');
    g.style.opacity='1';

    if(!SEL)return;

    if(t.id===SEL){
      r.setAttribute('stroke',CH_COL[ch]);
      r.setAttribute('stroke-width','2.5');
    } else if(lastUM[t.id]!==undefined){
      const ci=Math.min(lastUM[t.id]-1,2);
      r.setAttribute('fill','#dbeeff');
      r.setAttribute('stroke',DU[ci]);
      r.setAttribute('stroke-width','1.8');
    } else if(lastBM[t.id]!==undefined){
      const ci=Math.min(lastBM[t.id]-1,2);
      r.setAttribute('fill','#f0e8ff');
      r.setAttribute('stroke',DB[ci]);
      r.setAttribute('stroke-width','1.8');
    } else {
      g.style.opacity='0.15';
    }
  });
}

// ── SELECT ─────────────────────────────────────────────────────────────────
function selNode(id){
  SEL=(SEL===id)?null:id;
  highlight();
  rl();
  rd();
}

// ── PAN / ZOOM ─────────────────────────────────────────────────────────────
function apt(){mr.setAttribute('transform',`translate(${pan.x.toFixed(1)},${pan.y.toFixed(1)}) scale(${pan.sc})`);}

let hasDragged=false;
sv.addEventListener('mousedown',e=>{
  if(e.target.closest('g[id^="n-"]'))return;
  dragging=true; hasDragged=false; lastMouse={x:e.clientX,y:e.clientY};
});
window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastMouse.x, dy=e.clientY-lastMouse.y;
  if(Math.abs(dx)>3||Math.abs(dy)>3) hasDragged=true;
  pan.x+=dx; pan.y+=dy;
  lastMouse={x:e.clientX,y:e.clientY};
  apt();
});
window.addEventListener('mouseup',()=>{dragging=false;});

sv.addEventListener('wheel',e=>{
  e.preventDefault();
  const rc=sv.getBoundingClientRect();
  const mx=e.clientX-rc.left, my=e.clientY-rc.top;
  const delta=e.deltaY>0?0.88:1.13;
  pan.x=mx-(mx-pan.x)*delta;
  pan.y=my-(my-pan.y)*delta;
  pan.sc=Math.max(0.08,Math.min(5,pan.sc*delta));
  apt();
},{passive:false});

// ── TOUCH SUPPORT ──────────────────────────────────────────────────────────
let lastTouches=null, lastPinchDist=null;

sv.addEventListener('touchstart',e=>{
  if(e.touches.length===1){
    hasDragged=false;
    lastTouches={x:e.touches[0].clientX, y:e.touches[0].clientY};
    lastPinchDist=null;
  } else if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    lastPinchDist=Math.sqrt(dx*dx+dy*dy);
    lastTouches=null;
  }
},{passive:true});

sv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&lastTouches){
    const dx=e.touches[0].clientX-lastTouches.x;
    const dy=e.touches[0].clientY-lastTouches.y;
    if(Math.abs(dx)>3||Math.abs(dy)>3) hasDragged=true;
    pan.x+=dx; pan.y+=dy;
    lastTouches={x:e.touches[0].clientX, y:e.touches[0].clientY};
    apt();
  } else if(e.touches.length===2&&lastPinchDist!==null){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const scale=dist/lastPinchDist;
    // zoom toward midpoint of two fingers
    const mx=(e.touches[0].clientX+e.touches[1].clientX)/2;
    const my=(e.touches[0].clientY+e.touches[1].clientY)/2;
    const rc=sv.getBoundingClientRect();
    const cx=mx-rc.left, cy=my-rc.top;
    pan.x=cx-(cx-pan.x)*scale;
    pan.y=cy-(cy-pan.y)*scale;
    pan.sc=Math.max(0.08,Math.min(5,pan.sc*scale));
    lastPinchDist=dist;
    apt();
  }
},{passive:false});

sv.addEventListener('touchend',e=>{
  if(e.touches.length===0){
    lastTouches=null;
    lastPinchDist=null;
  }
},{passive:true});

function rv(){
  const rc=sv.getBoundingClientRect();
  const fitSc=Math.min(rc.width,rc.height)/5860*0.9;
  pan={x:rc.width/2-2996*fitSc, y:rc.height/2-2996*fitSc, sc:fitSc};
  apt();
}
function zi(){pan.sc=Math.min(5,pan.sc*1.2);apt();}
function zo(){pan.sc=Math.max(0.08,pan.sc*0.83);apt();}

// ── LIST ───────────────────────────────────────────────────────────────────
function rl(){
  const q='';
  const fi=T.filter(t=>true);

  document.getElementById('tlist').innerHTML=fi.map(t=>{
    const ch=t.id.split('.')[0];
    const du=lastUM[t.id], db=lastBM[t.id];
    const badge=du!==undefined
      ?` <span style="font-size:9px;background:#dbeeff;color:#1a6dd4;padding:0 3px;border-radius:3px">↑${du}</span>`
      :db!==undefined
      ?` <span style="font-size:9px;background:#f0e8ff;color:#6b21e8;padding:0 3px;border-radius:3px">↓${db}</span>`
      :'';
    const utg=t.d.slice().sort((a,b)=>a.split('.').map(Number).reduce((x,y)=>x*1000+y)-b.split('.').map(Number).reduce((x,y)=>x*1000+y)).map(d=>`<span class="tag tu">${d}</span>`).join('');
    const btg=(UB[t.id]||[]).slice().sort((a,b)=>a.split('.').map(Number).reduce((x,y)=>x*1000+y)-b.split('.').map(Number).reduce((x,y)=>x*1000+y)).map(d=>`<span class="tag tb2">${d}</span>`).join('');
    const bgStyle=SEL&&SEL!==t.id&&du!==undefined?'background:rgba(219,238,255,0.5)'
                 :SEL&&SEL!==t.id&&db!==undefined?'background:rgba(240,232,255,0.5)':'';
    return `<div class="ti${SEL===t.id?' sel':''}" style="${bgStyle}" onclick="selNode('${t.id}')">
      <div class="tdot" style="background:${CH_COL[ch]}"></div>
      <div class="tinf">
        <div class="tiid">${t.id}${badge}</div>
        ${t.n?`<div class="tinm">${t.n}</div>`:''}
        <div class="titags">${utg}${btg}</div>
      </div>
    </div>`;
  }).join('');

}

function rd(){
  const dp=document.getElementById('detail');
  if(!SEL){dp.innerHTML='';return;}
  const t=T.find(x=>x.id===SEL);
  const ch=t.id.split('.')[0];
  const sortIds=arr=>arr.slice().sort((a,b)=>a.split('.').map(Number).reduce((x,y)=>x*1000+y)-b.split('.').map(Number).reduce((x,y)=>x*1000+y));
  const utg=t.d.length?sortIds(t.d).map(d=>`<span class="tag tu" style="cursor:pointer" onclick="selNode('${d}')">${d}</span>`).join(''):'<span style="color:#9b9b96;font-style:italic;font-size:10px">없음</span>';
  const btg=(UB[t.id]||[]).length?sortIds(UB[t.id]||[]).map(d=>`<span class="tag tb2" style="cursor:pointer" onclick="selNode('${d}')">${d}</span>`).join(''):'<span style="color:#9b9b96;font-style:italic;font-size:10px">없음</span>';
  dp.innerHTML=`<h4 style="color:${CH_COL[ch]}">Theorem ${t.id}${t.n?' — '+t.n:''}</h4>
    <div class="ddr"><span class="ddl">사용</span><div class="ddtags">${utg}</div></div>
    <div class="ddr"><span class="ddl">피사용</span><div class="ddtags">${btg}</div></div>`;
}

function setCh(c,btn){
  curCh=c;
  document.querySelectorAll('.cb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  rl();
}

// ── INIT ───────────────────────────────────────────────────────────────────
buildMap();
rl();
rd();
</script>
</body>
